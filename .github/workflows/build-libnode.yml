name: Build libnode for OpenHarmony

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: "Node.js version (e.g. 24.2.0)"
        required: true
        default: "24.2.0"
        type: string
      arch:
        description: "Target architecture"
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - x64
          - both

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ inputs.arch == 'both' && ['arm64', 'x64'] || [inputs.arch] }}
    env:
      NODE_VERSION: ${{ inputs.node_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file make python3 \
            unzip xz-utils jq python3-pip

      - name: Set up Java 17 (for binary-sign-tool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --- OHOS SDK + LLVM-19 (cached) ------------------------------------------
      - name: Cache OHOS SDK + LLVM-19
        id: cache-ohos
        uses: actions/cache@v4
        with:
          path: |
            .build/ohos-sdk
            .build/llvm-19
          key: ohos-sdk-llvm19-v1

      - name: Download OpenHarmony SDK + LLVM-19
        if: steps.cache-ohos.outputs.cache-hit != 'true'
        run: |
          mkdir -p .build
          cd .build

          query_component() {
            local component="$1"
            for i in 1 2 3 4 5; do
              echo "Querying ${component} (attempt ${i}/5)..."
              local url
              url=$(curl -fsSL --connect-timeout 30 --max-time 120 \
                'https://dcp.openharmony.cn/api/daily_build/build/list/component' \
                -H 'Accept: application/json, text/plain, */*' \
                -H 'Content-Type: application/json' \
                --data-raw '{"projectName":"openharmony","branch":"master","pageNum":1,"pageSize":10,"deviceLevel":"","component":"'"${component}"'","type":1,"startTime":"2025080100000000","endTime":"20990101235959","sortType":"","sortField":"","hardwareBoard":"","buildStatus":"success","buildFailReason":"","withDomain":1}' \
                2>/dev/null | jq -r ".data.list.dataList[0].obsPath" 2>/dev/null)
              if [ -n "$url" ] && [ "$url" != "null" ]; then
                echo "$url"
                return 0
              fi
              echo "Attempt ${i} failed, retrying in 15s..."
              sleep 15
            done
            echo "ERROR: Failed to query ${component}" >&2
            return 1
          }

          # OHOS SDK
          echo "==> Downloading OpenHarmony SDK..."
          SDK_URL=$(query_component "ohos-sdk-public")
          curl -fL --retry 5 --retry-delay 10 --connect-timeout 30 --max-time 600 \
            -o ohos-sdk-public.tar.gz "$SDK_URL"
          tar -zxf ohos-sdk-public.tar.gz
          rm -rf daily_build.log manifest_tag.xml ohos-sdk/windows ohos-sdk/ohos
          cd ohos-sdk/linux
          unzip -q toolchains-*.zip
          rm -rf *.zip
          cd ../..
          rm -f ohos-sdk-public.tar.gz
          echo "    OHOS SDK ready"

          # LLVM-19
          echo "==> Downloading LLVM-19..."
          LLVM_URL=$(query_component "LLVM-19")
          curl -fL --retry 5 --retry-delay 10 --connect-timeout 30 --max-time 600 \
            -o LLVM-19.tar.gz "$LLVM_URL"
          mkdir -p llvm-19
          tar -zxf LLVM-19.tar.gz -C llvm-19
          cd llvm-19
          tar -zxf llvm-linux-x86_64.tar.gz
          tar -zxf ohos-sysroot.tar.gz
          cd ..
          rm -f LLVM-19.tar.gz
          echo "    LLVM-19 ready"

      # --- Node.js source (cached per version) ----------------------------------
      - name: Cache Node.js source
        id: cache-node
        uses: actions/cache@v4
        with:
          path: .build/node-v${{ env.NODE_VERSION }}
          key: node-src-v${{ env.NODE_VERSION }}

      - name: Download Node.js source
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: |
          mkdir -p .build
          cd .build
          echo "==> Downloading Node.js v${NODE_VERSION}..."
          curl -fL --retry 5 --retry-delay 10 \
            -o node-src.tar.gz \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}.tar.gz"
          tar -zxf node-src.tar.gz
          rm -f node-src.tar.gz
          echo "    Node.js source ready"

      # --- Build -----------------------------------------------------------------
      - name: Build libnode.so
        env:
          OUTPUT_DIR: ${{ github.workspace }}/dist
        run: |
          chmod +x scripts/build-node-ohos.sh
          ./scripts/build-node-ohos.sh "${NODE_VERSION}" "${{ matrix.arch }}" "$(nproc)"

      # --- Verify -----------------------------------------------------------------
      - name: Verify build output
        run: |
          SO="dist/libnode-${{ matrix.arch }}.so"
          echo "==> ${SO}"
          file "${SO}"
          ls -lh "${SO}"
          echo ""
          echo "==> ELF check (must be ET_DYN, no PT_INTERP)..."
          python3 - "${SO}" <<'PYEOF'
import struct, sys
p = sys.argv[1]
d = open(p, 'rb').read(64)
assert d[:4] == b'\x7fELF', "Not an ELF"
le = d[5] == 1
fmt = '<' if le else '>'
etype   = struct.unpack(fmt + 'H', d[16:18])[0]
machine = struct.unpack(fmt + 'H', d[18:20])[0]
e_phoff = struct.unpack(fmt + 'Q', d[32:40])[0]
phentsize = struct.unpack(fmt + 'H', d[54:56])[0]
phnum   = struct.unpack(fmt + 'H', d[56:58])[0]
interp = False
with open(p, 'rb') as f:
    for i in range(phnum):
        f.seek(e_phoff + i * phentsize)
        ph = f.read(phentsize)
        if struct.unpack(fmt + 'I', ph[0:4])[0] == 3:
            interp = True
            break
assert etype == 3, f"Expected ET_DYN(3), got {etype}"
assert not interp, "PT_INTERP found — this is a PIE executable, not a shared library!"
arch_names = {183: 'AArch64', 62: 'x86-64'}
print(f"    ET_DYN ✓  machine={arch_names.get(machine, machine)}  PT_INTERP=none ✓")
PYEOF
          echo ""
          echo "==> Check node::Start export..."
          nm -D "${SO}" | grep "node5Start" && echo "    node::Start exported ✓" || { echo "    ✗ node::Start NOT found"; exit 1; }

      # --- Package -----------------------------------------------------------------
      - name: Package output
        run: |
          SHA=$(sha256sum "dist/libnode-${{ matrix.arch }}.so" | awk '{print $1}')
          SIZE=$(stat -c%s "dist/libnode-${{ matrix.arch }}.so")
          echo "sha256=${SHA}" >> "$GITHUB_ENV"
          echo "size=${SIZE}" >> "$GITHUB_ENV"
          echo ""
          echo "libnode-${{ matrix.arch }}.so"
          echo "  SHA-256: ${SHA}"
          echo "  Size:    ${SIZE} bytes"

      # --- Upload artifact -----------------------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: libnode-ohos-${{ env.NODE_VERSION }}-${{ matrix.arch }}
          path: dist/libnode-${{ matrix.arch }}.so
          if-no-files-found: error

      # --- Publish GitHub Release ----------------------------------------------------
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${NODE_VERSION}-${{ matrix.arch }}"
          gh release create "${TAG}" \
            "dist/libnode-${{ matrix.arch }}.so" \
            --title "libnode ${NODE_VERSION} for OpenHarmony ${{ matrix.arch }}" \
            --notes "SHA-256: ${sha256}\nSize: ${size} bytes\n\nBuilt from Node.js v${NODE_VERSION} with OHOS SDK + LLVM-19.\n\`\`\`--shared --cross-compiling --openssl-no-asm --dest-os=openharmony\`\`\`" \
            --prerelease \
            || echo "Release ${TAG} already exists, skipping"
