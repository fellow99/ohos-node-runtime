name: Build libnode for OpenHarmony

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: "Node.js version (without leading v), e.g. 24.2.0"
        required: true
        default: "24.2.0"
        type: string
      arch:
        description: "Target architecture"
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - x64
          - both
      llvm_url:
        description: "Pinned OpenHarmony LLVM-19 daily-build tarball URL"
        required: true
        # Daily build 20261024 (contains llvm-linux-x86_64 + ohos-sysroot + libcxx-ndk)
        default: "https://cidownload.openharmony.cn/version/Daily_Version/LLVM-19/20261024_061421/version-Daily_Version-LLVM-19-20261024_061421-LLVM-19.tar.gz"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ inputs.arch == 'both' && fromJSON('["arm64","x64"]') || fromJSON(format('["{0}"]', inputs.arch)) }}
    env:
      NODE_VERSION: ${{ inputs.node_version }}
      LLVM_URL: ${{ inputs.llvm_url }}
      BUILD_DIR: ${{ github.workspace }}/.build
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file make python3 \
            tar xz-utils jq ccache

      # Cross-compiling V8 (thousands of Torque-generated CSA TUs + Maglev/TurboFan)
      # spawns 4 clang++ processes that can peak well above the runner's 16 GB RAM,
      # causing multi-minute reclaim/swap stalls. Add a 16 GB swapfile on the fast
      # NVMe temp disk so no TU thrashes (or gets OOM-killed).
      - name: Add swap space
        run: |
          sudo fallocate -l 16G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          df -h /mnt

      # ccache makes re-runs (and retries after timeout) incremental instead of
      # rebuilding all ~4k objects from zero.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .build/ccache
          key: ccache-ohos-${{ inputs.node_version }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-ohos-${{ inputs.node_version }}-${{ matrix.arch }}-
            ccache-ohos-${{ inputs.node_version }}-

      # --- LLVM-19 toolchain (cache the 700MB tarball; extract fresh each run) ---
      - name: Cache LLVM-19 tarball
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: .build/LLVM-19.tar.gz
          key: llvm19-${{ inputs.llvm_url }}

      - name: Connectivity check
        run: |
          echo "== Probing cidownload.openharmony.cn =="
          curl -sSIL --max-time 40 "$LLVM_URL" -o /dev/null -w 'http=%{http_code} size=%{size_download} time=%{time_total}s\n' || true

      - name: Download LLVM-19
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$BUILD_DIR"
          echo "Downloading $LLVM_URL (~700MB) ..."
          curl -fL --retry 5 --retry-delay 10 --connect-timeout 30 \
            --max-time 1800 -o "$BUILD_DIR/LLVM-19.tar.gz" "$LLVM_URL"
          ls -lh "$BUILD_DIR/LLVM-19.tar.gz"

      - name: Extract LLVM-19 (clang + sysroot + libc++)
        run: |
          cd "$BUILD_DIR"
          mkdir -p llvm19-pkg llvm-19
          tar -zxf LLVM-19.tar.gz -C llvm19-pkg
          echo "== Outer package contents =="
          ls -lh llvm19-pkg/
          cd llvm-19
          tar -zxf ../llvm19-pkg/llvm-linux-x86_64.tar.gz
          if [ -f ../llvm19-pkg/ohos-sysroot.tar.gz ]; then
            tar -zxf ../llvm19-pkg/ohos-sysroot.tar.gz
          fi
          echo "== clang wrappers =="
          ls llvm/bin/ | grep -E 'unknown-linux-ohos-clang$|unknown-linux-ohos-clang\+\+$' | head
          # libc++_shared.so from the NDK libcxx package. Each tarball is
          # multi-arch (arm/arm64/x86_64 subdirs), so extract ONLY the one for
          # the arch we are building to avoid later picking the wrong triple.
          case "${{ matrix.arch }}" in
            arm64) LIBCXX_ARCH=aarch64 ;;
            x64)   LIBCXX_ARCH=x86_64 ;;
          esac
          LIBCXX_TGZ="../llvm19-pkg/libcxx-ndk-linux-${LIBCXX_ARCH}.tar.gz"
          if [ -f "$LIBCXX_TGZ" ]; then
            mkdir -p libcxx-ndk
            tar -zxf "$LIBCXX_TGZ" -C libcxx-ndk
            find libcxx-ndk -name 'libc++_shared.so' | head
          else
            echo "ERROR: missing $LIBCXX_TGZ" >&2; exit 1
          fi

      # --- Node.js source -------------------------------------------------------
      - name: Cache Node.js source
        id: cache-node
        uses: actions/cache@v4
        with:
          path: .build/node-v${{ env.NODE_VERSION }}
          key: node-src-v${{ env.NODE_VERSION }}

      - name: Download Node.js source
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: |
          cd "$BUILD_DIR"
          echo "== Downloading Node.js v${NODE_VERSION} =="
          curl -fL --retry 5 --retry-delay 10 --max-time 600 \
            -o node-src.tar.gz \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}.tar.gz"
          tar -zxf node-src.tar.gz
          rm -f node-src.tar.gz

      # --- Build ----------------------------------------------------------------
      - name: Build libnode.so
        env:
          CCACHE_DIR: ${{ github.workspace }}/.build/ccache
          CCACHE_COMPRESS: "1"
          CCACHE_COMPRESSLEVEL: "6"
          CCACHE_MAXSIZE: "1500M"
          CCACHE_SLOPPINESS: "time_macros,include_file_mtime,include_file_ctime,pch_defines"
        run: |
          ccache --version
          ccache -z
          chmod +x scripts/build-node-ohos.sh
          ./scripts/build-node-ohos.sh \
            "${NODE_VERSION}" \
            "${{ matrix.arch }}" \
            "$BUILD_DIR/llvm-19/llvm" \
            "$BUILD_DIR/node-v${NODE_VERSION}" \
            "$GITHUB_WORKSPACE/dist" \
            "$(nproc)"
          ccache -s || true

      # --- Bundle the matching-arch libc++_shared.so ----------------------------
      # The libcxx package ships several triples; selecting by exact triple dir
      # (not `find | head -1`, whose result depends on FS order) is what keeps
      # the bundled libc++ from being x86_64/arm32 for an arm64 engine.
      - name: Bundle libc++_shared.so
        run: |
          case "${{ matrix.arch }}" in
            arm64) LIBCXX_TRIPLE=aarch64-unknown-linux-ohos ;;
            x64)   LIBCXX_TRIPLE=x86_64-unknown-linux-ohos ;;
          esac
          LIBCXX=$(find "$BUILD_DIR/llvm-19/libcxx-ndk" \
            -path "*/lib/${LIBCXX_TRIPLE}/libc++_shared.so" | head -1)
          if [ -z "$LIBCXX" ] || [ ! -f "$LIBCXX" ]; then
            echo "ERROR: ${LIBCXX_TRIPLE} libc++_shared.so not found in libcxx-ndk" >&2
            exit 1
          fi
          cp "$LIBCXX" dist/libc++_shared.so
          echo "Bundled: $LIBCXX"
          ls -lh dist/libc++_shared.so

      # --- Verify ---------------------------------------------------------------
      - name: Verify build output
        run: |
          SO="dist/libnode-${{ matrix.arch }}.so"
          file "$SO"
          ls -lh dist/
          echo ""
          echo "== ELF gate (ET_DYN, no PT_INTERP) =="
          python3 scripts/verify-libnode.py "$SO"
          echo ""
          echo "== node::Start export =="
          nm -D "$SO" | grep "node5Start"
          echo ""
          echo "== DT_NEEDED =="
          readelf -d "$SO" | grep NEEDED
          echo ""
          echo "== Architecture gate: engine AND libc++ must be ${{ matrix.arch }} =="
          case "${{ matrix.arch }}" in
            arm64) MACH=AArch64 ;;
            x64)   MACH=X86-64 ;;
          esac
          readelf -h "$SO" | grep -E "Machine:"
          readelf -h "$SO" | grep -q "$MACH"
          if [ ! -f dist/libc++_shared.so ]; then
            echo "ERROR: dist/libc++_shared.so is missing" >&2; exit 1
          fi
          readelf -h dist/libc++_shared.so | grep -E "Machine:"
          readelf -h dist/libc++_shared.so | grep -q "$MACH"

      # --- Checksums ------------------------------------------------------------
      - name: Compute checksums
        run: |
          cd dist
          sha256sum libnode-${{ matrix.arch }}.so > libnode-${{ matrix.arch }}.so.sha256
          [ -f libc++_shared.so ] && sha256sum libc++_shared.so > libc++_shared.so.sha256 || true
          cat libnode-${{ matrix.arch }}.so.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: libnode-ohos-${{ env.NODE_VERSION }}-${{ matrix.arch }}
          path: |
            dist/libnode-${{ matrix.arch }}.so
            dist/libnode-${{ matrix.arch }}.so.sha256
            dist/libc++_shared.so
            dist/libc++_shared.so.sha256
          if-no-files-found: error

      # --- GitHub Release --------------------------------------------------------
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${NODE_VERSION}-ohos-${{ matrix.arch }}"
          FILES="dist/libnode-${{ matrix.arch }}.so dist/libnode-${{ matrix.arch }}.so.sha256"
          [ -f dist/libc++_shared.so ] && FILES="$FILES dist/libc++_shared.so dist/libc++_shared.so.sha256"
          NOTES="Shared libnode.so built from Node.js v${NODE_VERSION} with OpenHarmony LLVM-19 (--shared --cross-compiling --openssl-no-asm --dest-os=openharmony)."
          # build-node-ohos.sh passes --v8-disable-temporal-support (Rust Temporal
          # crates have no OHOS cross target), so Node >= 26 engines lack Temporal.
          if [ "${NODE_VERSION%%.*}" -ge 26 ]; then
            NOTES="${NOTES}"$'\n\n'"Note: Temporal is disabled (--v8-disable-temporal-support); this build does not provide the Temporal API."
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES \
              --title "libnode ${NODE_VERSION} for OpenHarmony ${{ matrix.arch }}" \
              --notes "$NOTES" \
              --prerelease
          fi
